spring:
  application:
    name: Url-Shortner

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID:not-set}"
            client-secret: "${GOOGLE_CLIENT_SECRET:not-set}"
            scope:
              - openid
              - profile
              - email


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

Jwt:
  issuer: "${issuer}"
  audience: "${audience}"
  Ref-Exp: "${Refresh-Exp}"
  private-key-location: "${private-key-location}"
  public-key-location: "${public-key-location}"
  access-token-ttl-ms: "${access-token-ttl-ms}"

App:
  Frontend: "${FrontendUri}"
  MaxAge: "${MaxAge}"