spring:
  application:
    name: Url-Shortner


Jwt:
  issuer: "${issuer}"
  audience: "${audience}"
  Ref-Exp: "${Refresh-Exp}"
  private-key-location: "${private-key-location}"
  public-key-location: "${public-key-location}"
  access-token-ttl-ms: "${access-token-ttl-ms}"

App:
  Frontend: "${FrontendUri}"
  MaxAge: "${MaxAge}"